name: Apply Thunder HUD v5

on:
  push:
    branches: [main]
    paths:
      - ".thunder/thunder_tail.txt"
      - ".github/workflows/apply-thunder-hud-v5.yml"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[bot] Apply Thunder HUD v5') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply Thunder tail
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("classes.js")
          tail = Path(".thunder/thunder_tail.txt").read_text(encoding="utf-8")
          text = p.read_text(encoding="utf-8")
          marker = "/* ========================= THUNDER CLIENT NATIVE"
          i = text.find(marker)
          if i < 0:
              raise SystemExit("Thunder HUD marker not found in classes.js")
          out = text[:i] + tail
          p.write_text(out, encoding="utf-8")
          print("Wrote", len(out), "bytes")
          PY

      - name: Validate JavaScript
        run: node --check classes.js

      - name: Commit patched classes.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classes.js
          git diff --cached --quiet && exit 0
          git commit -m "[bot] Apply Thunder HUD v5"
          git push
