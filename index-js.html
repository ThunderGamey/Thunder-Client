			/* ===== Thunder loading screen: a storm from the moment the page opens =====
			   The storm canvas is opaque, so nothing the game draws while it starts (its own
			   logo screens) shows through. Both sit on <html>, not <body>: the game empties
			   <body> (its container) when it starts. */
			#stormCanvas {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				z-index: 1999;
				background: #000;
				pointer-events: none;
			}
			#thunderLoadScreen {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				z-index: 2000;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				pointer-events: none;
				cursor: default;
				user-select: none;
				-webkit-user-select: none;
				background: radial-gradient(ellipse at 50% 55%, rgba(5, 8, 16, 0.55), rgba(5, 8, 16, 0) 60%);

			#thunderLoadLogo {
				font-family: 'Courier New', monospace;
				font-weight: bold;
				font-size: clamp(30px, 5.2vw, 84px);
				letter-spacing: 0.12em;
				color: #eaf6ff;

					-3px 0 0 #4fd1ff,

					0 0 55px #4fd1ff;

				margin-bottom: 18px;

			#thunderLoadLogo .bolt, #splashTitle .bolt {
				display: inline-block;
				transform: scale(1.15) rotate(-4deg);
				color: #ffffff;
				text-shadow:
					0 0 15px #ffffff,
					0 0 40px #7fe3ff,
					0 0 80px #4fd1ff;
			}
			#thunderLoadLabel {
				font-family: 'Courier New', monospace;
				font-weight: bold;
				font-size: clamp(13px, 1.5vw, 24px);
				letter-spacing: 0.3em;
				color: #cfeeff;
				text-shadow:
					2px 0 0 #4fd1ff,
					-2px 0 0 #4fd1ff,
					0 0 25px #7fe3ff;
				margin-bottom: 18px;
			}
			#thunderBarOuter {
				width: min(40vw, 560px);
				min-width: 240px;
				height: 30px;
				background: rgba(10, 14, 24, 0.85);
				border: 2px solid #3a8bb8;
				border-radius: 3px;
				position: relative;
				overflow: hidden;
				box-shadow:
					0 0 0 1px rgba(79, 209, 255, 0.15) inset,
					0 0 22px rgba(79, 209, 255, 0.25);
			}
			#thunderBarFill {
				height: 100%;
				width: 0%;
				background: linear-gradient(90deg, #1c5f82, #4fd1ff 60%, #eaf6ff);
				box-shadow: 0 0 20px 2px #4fd1ff;
				position: relative;
			}
			/* jagged lightning notch that rides at the leading edge of the fill */
			#thunderBarFill::after {
				content: "";
				position: absolute;
				top: 0;
				right: -9px;
				width: 18px;
				height: 100%;
				background: #eaf6ff;
				clip-path: polygon(60% 0%, 100% 0%, 40% 45%, 80% 45%, 20% 100%, 50% 55%, 0% 55%);
				filter: drop-shadow(0 0 6px #ffffff);
			}
			/* tick marks across the bar for texture */
			#thunderBarOuter .tick {
				position: absolute;
				top: 0;
				bottom: 0;
				width: 2px;
				background: rgba(5, 8, 16, 0.5);
			}
			#thunderPercent, #thunderLoadStatus {
				font-family: 'Courier New', monospace;
				color: #7fe3ff;
				letter-spacing: 0.15em;
				text-shadow: 0 0 10px rgba(79, 209, 255, 0.6);
			}
			#thunderPercent {
				margin-top: 16px;
				font-size: clamp(12px, 1vw, 18px);
			}
			#thunderLoadStatus {
				margin-top: 8px;
				font-size: clamp(11px, 0.85vw, 15px);
				letter-spacing: 0.08em;
				color: #9ccfe6;
				min-height: 1.3em;
			}
			#thunderPlay {
				margin-top: 22px;
				font-family: 'Courier New', monospace;
				font-weight: bold;
				font-size: clamp(14px, 1.4vw, 24px);
				letter-spacing: 0.25em;
				color: #eaf6ff;
				text-shadow: 0 0 12px #7fe3ff, 0 0 30px #4fd1ff;
				display: none;
				animation: thunderPulse 1.1s ease-in-out infinite;
			}
			@keyframes thunderPulse {
				0%, 100% { opacity: 0.45; }
				50% { opacity: 1; }
			}

			/* ===== Title splash (after loading) ===== */
			#splashTitle {
				position: fixed;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%) scale(0.85);
				font-family: 'Courier New', monospace;
				font-weight: bold;
				font-size: 6vw;
				letter-spacing: 0.12em;
				color: #eaf6ff;
				text-shadow:
					3px 0 0 #4fd1ff,
					-3px 0 0 #4fd1ff,
					0 0 25px #7fe3ff,
					0 0 55px #4fd1ff,
					0 0 90px #2b7ba3;
				z-index: 2002;
				opacity: 0;
				pointer-events: none;
				white-space: nowrap;
				clip-path: polygon(
					0% 10%, 3% 0%, 97% 0%, 100% 10%,
					100% 90%, 97% 100%, 3% 100%, 0% 90%
				);
				padding: 6px 18px;
			}
			#splashFlash {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background: white;
				opacity: 0;
				z-index: 2001;
				pointer-events: none;
			}

		<script type="text/javascript">
/* Thunder input bridge: keep keyboard/wheel focus on the Eagler canvas without
   stealing focus from real HTML controls such as the Thunder search box. */
(function(){
  "use strict";
  function isHtmlControl(el){
    if(!el) return false;
    var tag=(el.tagName||"").toLowerCase();
    return tag==="input"||tag==="textarea"||tag==="select"||tag==="button"||el.isContentEditable;
  }
  function focusGame(){
    try{
      if(isHtmlControl(document.activeElement)) return;
      var c=document.querySelector("#game_frame canvas");
      if(!c) return;
      if(typeof c.tabIndex!=="number" || c.tabIndex<0) c.tabIndex=-1;
      if(document.activeElement!==c){
        try{c.focus({preventScroll:true});}catch(_){try{c.focus();}catch(__){}}
      }
    }catch(_){}
  }
  window.addEventListener("pointerdown",function(){setTimeout(focusGame,0);},{passive:true});
  window.addEventListener("wheel",function(){setTimeout(focusGame,0);},{passive:true});
  window.addEventListener("keydown",function(){setTimeout(focusGame,0);},{passive:true});
})();
</script>

	<body style="margin:0px;width:100%;height:100%;overflow:hidden;background-color:black;" id="game_frame">
		<script type="text/javascript">
/* ===== Thunder loading screen and intro =====
   Starts the moment the page opens, while the game downloads and starts underneath:
   a storm (clouds, rain, lightning, and thunder with every flash), the Thunder logo and a
   loading bar that follows the real start-up (the game code arriving, the game starting,
   its first menu on screen, the built-in packs ready). Then the THUNDER CLIENT splash
   strikes three times and the storm clears to the title screen.
   Browsers play sound only after the first click or key press on the page, and the game
   itself waits for one before it starts its sound (its own click-to-continue screen is
   under this one). So while sound is still locked, "CLICK ANYWHERE TO START" shows, and
   until the game's first menu is up every click goes through to the game underneath.
   From then on clicks stop here, so nothing on the title screen is pressed unseen. */
(function() {
	"use strict";
	var root = document.documentElement;
	var A = window.ThunderAmbient || null;
	function thunder(big) { if (A && A.thunder) { try { A.thunder(big); } catch (e) {} } }
	function rain(on) { if (A && A.rain) { try { A.rain(on); } catch (e) {} } }
	function canPlay() { try { return !!(A && A.canPlay && A.canPlay()); } catch (e) { return false; } }

	// ---------------------------------------------------------------
	// storm canvas: clouds, rain, lightning (opaque, so the game's
	// start-up screens underneath never show)
	// ---------------------------------------------------------------
	var stormActive = true;
	var canvas = document.createElement('canvas');
	canvas.id = 'stormCanvas';
	root.appendChild(canvas);
	var g = canvas.getContext('2d');
	var dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
	function resize() {
		var w = window.innerWidth, h = window.innerHeight;
		canvas.style.width = w + 'px';
		canvas.style.height = h + 'px';
		canvas.width = Math.round(w * dpr);
		canvas.height = Math.round(h * dpr);
		g.setTransform(dpr, 0, 0, dpr, 0, 0);
	}
	window.addEventListener('resize', resize);
	resize();
	function viewW() { return canvas.width / dpr; }
	function viewH() { return canvas.height / dpr; }

	var clouds = [];
	for (var i = 0; i < 16; i++) {
		clouds.push({
			x: Math.random() * viewW(),
			y: Math.random() * viewH() * 0.55,
			scale: 0.7 + Math.random() * 1.8,
			speed: 0.3 + Math.random() * 0.9,
			opacity: 0.2 + Math.random() * 0.3
		});
	}
	var rainDrops = [];
	for (var r = 0; r < 260; r++) {
		rainDrops.push({
			x: Math.random() * viewW(),
			y: Math.random() * viewH(),
			len: 10 + Math.random() * 20,
			speed: 8 + Math.random() * 10,
			drift: 2 + Math.random() * 2
		});
	}
	function drawRain(k) {
		g.save();
		g.strokeStyle = 'rgba(150, 190, 230, 0.35)';
		g.lineWidth = 1;
		g.beginPath();
		for (var j = 0; j < rainDrops.length; j++) {
			var d = rainDrops[j];
			g.moveTo(d.x, d.y);
			g.lineTo(d.x - d.drift, d.y + d.len);
			d.x -= d.drift * k;
			d.y += d.speed * k;
			if (d.y > viewH()) {
				d.y = -d.len;
				d.x = Math.random() * (viewW() + 60);
			}
		}
		g.stroke();
		g.restore();
	}
	var CLOUD_PUFFS = [[0, 0, 40], [35, -10, 30], [-35, -5, 28], [15, 15, 32], [-15, 15, 30]];
	function drawCloud(c) {
		g.save();
		g.translate(c.x, c.y);
		g.scale(c.scale, c.scale);
		g.fillStyle = 'rgba(55, 70, 95, ' + c.opacity + ')';
		g.beginPath();
		// each puff is its own closed circle (no connecting edges between them)
		for (var p = 0; p < CLOUD_PUFFS.length; p++) {
			var f = CLOUD_PUFFS[p];
			g.moveTo(f[0] + f[2], f[1]);
			g.arc(f[0], f[1], f[2], 0, Math.PI * 2);
		}
		g.fill();
		g.restore();
	}

	var flashAlpha = 0, boltPoints = null, shakeFrames = 0;
	var nextFlashAt = performance.now() + 500 + Math.random() * 900;
	function generateBolt() {
		var points = [], branches = [];
		var x = viewW() * (0.1 + Math.random() * 0.8), y = 0;
		points.push({ x: x, y: y });
		var segments = 10 + Math.floor(Math.random() * 8);
		for (var s = 0; s < segments; s++) {
			x += (Math.random() - 0.5) * 90;
			y += viewH() / segments;
			points.push({ x: x, y: y });
			if (Math.random() < 0.35 && s > 2) {
				var bx = x, by = y, branch = [{ x: bx, y: by }];
				var bSegs = 2 + Math.floor(Math.random() * 3);
				for (var b = 0; b < bSegs; b++) {
					bx += (Math.random() - 0.5) * 80 + 30;
					by += 25 + Math.random() * 20;
					branch.push({ x: bx, y: by });
				}
				branches.push(branch);
			}
		}
		return { main: points, branches: branches };
	}
	function drawLine(points, alpha, width) {
		g.beginPath();
		g.moveTo(points[0].x, points[0].y);
		for (var p = 1; p < points.length; p++) g.lineTo(points[p].x, points[p].y);
		g.strokeStyle = 'rgba(210, 235, 255, ' + alpha + ')';
		g.lineWidth = width;
		g.stroke();
	}
	function drawBolt(bolt, alpha) {
		g.save();
		g.shadowColor = '#7fe3ff';
		g.shadowBlur = 35;
		drawLine(bolt.main, alpha, 3);
		for (var q = 0; q < bolt.branches.length; q++) drawLine(bolt.branches[q], alpha * 0.7, 1.6);
		g.restore();
	}
	// the thunder comes the instant the flash does
	function strike() {
		flashAlpha = 1;
		boltPoints = generateBolt();
		shakeFrames = 8;
		thunder(false);
		if (Math.random() < 0.3) {
			setTimeout(function() {
				flashAlpha = 1;
				boltPoints = generateBolt();
				shakeFrames = 6;
			}, 90);
		}
	}

	var lastFrame = performance.now();
	function animate(now) {
		if (!stormActive) return;
		var k = Math.min(3, Math.max(0.25, (now - lastFrame) / 16.7));
		lastFrame = now;
		g.save();
		if (shakeFrames > 0) {
			var mag = shakeFrames * 0.8;
			g.translate((Math.random() - 0.5) * mag, (Math.random() - 0.5) * mag);
			shakeFrames--;
		}
		g.clearRect(-20, -20, viewW() + 40, viewH() + 40);
		var grad = g.createLinearGradient(0, 0, 0, viewH());
		grad.addColorStop(0, 'rgba(5,7,15,0.35)');
		grad.addColorStop(1, 'rgba(19,26,48,0.35)');
		g.fillStyle = grad;
		g.fillRect(-20, -20, viewW() + 40, viewH() + 40);
		for (var c = 0; c < clouds.length; c++) {
			var cl = clouds[c];
			cl.x += cl.speed * k;
			if (cl.x - 100 > viewW()) cl.x = -100;
			drawCloud(cl);
		}
		drawRain(k);
		if (now >= nextFlashAt) {
			strike();
			nextFlashAt = now + 900 + Math.random() * 1700;
		}
		if (flashAlpha > 0) {
			g.fillStyle = 'rgba(190, 220, 255, ' + (flashAlpha * 0.18) + ')';
			g.fillRect(-20, -20, viewW() + 40, viewH() + 40);
			if (boltPoints) drawBolt(boltPoints, flashAlpha);
			flashAlpha -= 0.07 * k;
			if (flashAlpha <= 0) boltPoints = null;
		}
		g.restore();
		requestAnimationFrame(animate);
	}
	requestAnimationFrame(animate);
	rain(true);

	// ---------------------------------------------------------------
	// logo, loading bar and status on top of the storm
	// ---------------------------------------------------------------
	var load = document.createElement('div');
	load.id = 'thunderLoadScreen';
	load.innerHTML =
		'<div id="thunderLoadLogo">THUNDER<span class="bolt">&#9889;</span>CLIENT</div>' +
		'<div id="thunderLoadLabel">LOADING</div>' +
		'<div id="thunderBarOuter"><div id="thunderBarFill"></div></div>' +
		'<div id="thunderPercent">0%</div>' +
		'<div id="thunderLoadStatus"></div>' +
		'<div id="thunderPlay">CLICK ANYWHERE TO START</div>';
	root.appendChild(load);
	var barOuter = load.querySelector('#thunderBarOuter');
	for (var t = 0; t < 22; t++) {
		var tickEl = document.createElement('div');
		tickEl.className = 'tick';
		tickEl.style.left = (t * (100 / 22)) + '%';
		barOuter.appendChild(tickEl);
	}
	var barFill = load.querySelector('#thunderBarFill');
	var percentLabel = load.querySelector('#thunderPercent');
	var statusLabel = load.querySelector('#thunderLoadStatus');
	var playPrompt = load.querySelector('#thunderPlay');
	// the first click or key press (it also lets the page play sound): the start prompt goes
	var clicked = false;
	function onFirstInput() {
		clicked = true;
		if (!waitingForClick) playPrompt.style.display = 'none';
		window.removeEventListener('pointerdown', onFirstInput, true);
		window.removeEventListener('keydown', onFirstInput, true);
	}
	window.addEventListener('pointerdown', onFirstInput, true);
	window.addEventListener('keydown', onFirstInput, true);

	// ---------------------------------------------------------------
	// progress: each start-up stage eases the bar toward its own mark,
	// so it keeps moving while that stage takes its time
	// ---------------------------------------------------------------
	var STAGES = [
		{ to: 30, tau: 4500, text: 'Downloading Thunder Client...' },
		{ to: 55, tau: 4500, text: 'Downloading the game files...' },
		{ to: 90, tau: 6000, text: 'Loading textures and sounds...' },
		{ to: 97, tau: 5000, text: 'Getting the Thunder packs ready...' }
	];
	var PACKS_WAIT_MS = 30000;      // never wait longer than this for the packs
	var progress = 0, stage = -1, menuAt = 0, codeAt = 0, lastTick = performance.now();
	var finished = false, waitingForClick = false;

	function bootStage(now) {
		if (typeof window.main !== 'function') return 0;           // classes.js still downloading
		if (!codeAt) codeAt = now;
		var T = window.ThunderClient, b = null;
		try { b = T && T.boot ? T.boot() : null; } catch (e) { b = null; }
		if (!b) return now - codeAt > 30000 ? 4 : 1;                 // no Thunder start-up info: wait a while
		if (!b.game) return 1;                                        // game files, graphics
		if (!b.menu) return 2;                                        // Minecraft starting
		if (!menuAt) menuAt = now;
		if (b.packsBusy && now - menuAt < PACKS_WAIT_MS) return 3;   // built-in packs
		return 4;
	}
	// an Eaglercraft screen the player has to see: a crash report, or the tap-to-launch box
	// mobile browsers get before the game starts
	function eaglerScreen() {
		return document.querySelector('._eaglercraftX_crash_element, ._eaglercraftX_crashWebGL, ._eaglercraftX_integratedserver_crash_element, ._eaglercraftX_mobile_press_any_key');
	}

	function tick(now) {
		if (finished) return;
		var dt = Math.min(250, now - lastTick);
		lastTick = now;
		var e = eaglerScreen();
		if (e) {
			var crash = !e.classList.contains('_eaglercraftX_mobile_press_any_key');
			if (crash) { endStorm(true); return; }
			load.style.visibility = canvas.style.visibility = 'hidden';   // let it be tapped
			requestAnimationFrame(tick);
			return;
		}
		load.style.visibility = canvas.style.visibility = '';
		var s = bootStage(now);
		if (s !== stage) {
			stage = s;
			if (s < 4) statusLabel.textContent = STAGES[s].text;
			// the game's first menu is up: clicks stop here from now on
			if (s >= 3) load.style.pointerEvents = canvas.style.pointerEvents = 'auto';
		}
		// sound still locked: the game will wait for a click, so ask for one
		if (!clicked && !waitingForClick) playPrompt.style.display = canPlay() ? 'none' : 'block';
		if (s < 4) {
			var st = STAGES[s];
			if (progress < st.to) progress += (st.to - progress) * (1 - Math.exp(-dt / st.tau));
		} else {
			progress = Math.min(100, progress + dt * 0.04);            // quick finish: 10% in 250 ms
		}
		barFill.style.width = progress + '%';
		percentLabel.textContent = Math.floor(progress) + '%';
		if (progress >= 100) {
			statusLabel.textContent = 'Ready';
			ready();
			return;
		}
		requestAnimationFrame(tick);
	}
	requestAnimationFrame(tick);

	// loading done: straight on when sound is allowed, else wait for a click or key
	function ready() {
		if (canPlay()) { finish(); return; }
		waitingForClick = true;
		playPrompt.textContent = 'CLICK TO PLAY';
		playPrompt.style.display = 'block';
		load.style.pointerEvents = canvas.style.pointerEvents = 'auto';
		var go = function() {
			if (!waitingForClick) return;
			waitingForClick = false;
			window.removeEventListener('pointerdown', go, true);
			window.removeEventListener('keydown', go, true);
			// the click also unlocks the sound (thunder_ambient.js); give it a moment to start
			setTimeout(finish, 120);
		};
		window.addEventListener('pointerdown', go, true);
		window.addEventListener('keydown', go, true);
	}

	function finish() {
		if (finished) return;
		finished = true;
		load.style.transition = 'opacity 0.4s ease-out';
		load.style.opacity = '0';
		setTimeout(function() {
			if (load.parentNode) load.parentNode.removeChild(load);
			runIntro();
		}, 400);
	}

	// ---------------------------------------------------------------
	// splash flash + title, three strikes, then the storm clears
	// ---------------------------------------------------------------
	function runIntro() {
		canvas.style.pointerEvents = 'auto';      // the title screen is underneath: no clicks on it yet
		var flashDiv = document.createElement('div');
		flashDiv.id = 'splashFlash';
		root.appendChild(flashDiv);
		var titleDiv = document.createElement('div');
		titleDiv.id = 'splashTitle';
		titleDiv.innerHTML = 'THUNDER<span class="bolt">&#9889;</span>CLIENT';
		root.appendChild(titleDiv);

		function flashOnce(peak, ms) {
			flashDiv.style.transition = 'none';
			flashDiv.style.opacity = String(peak);
			requestAnimationFrame(function() {
				flashDiv.style.transition = 'opacity ' + ms + 'ms ease-out';
				flashDiv.style.opacity = '0';
			});
		}
		flashOnce(0.85, 220);
		setTimeout(function() { flashOnce(0.65, 260); }, 180);
		setTimeout(function() { flashOnce(0.9, 300); }, 380);
		thunder(true);
		setTimeout(function() { thunder(true); }, 220);
		setTimeout(function() {
			titleDiv.style.transition = 'opacity 0.15s ease-out, transform 0.15s ease-out';
			titleDiv.style.opacity = '1';
			titleDiv.style.transform = 'translate(-50%, -50%) scale(1)';
			flashOnce(1, 350);
			thunder(true);
		}, 620);
		setTimeout(function() {
			titleDiv.style.transition = 'opacity 0.8s ease-in';
			titleDiv.style.opacity = '0';
		}, 2200);
		setTimeout(function() {
			if (titleDiv.parentNode) titleDiv.parentNode.removeChild(titleDiv);
			if (flashDiv.parentNode) flashDiv.parentNode.removeChild(flashDiv);
			endStorm(false);
		}, 3100);
	}

	// the storm and its rain stop for good, so none of it follows into worlds or servers
	function endStorm(now) {
		finished = true;
		waitingForClick = false;
		rain(false);
		canvas.style.pointerEvents = 'none';
		if (load.parentNode) load.parentNode.removeChild(load);
		var remove = function() {
			stormActive = false;
			if (canvas.parentNode) canvas.parentNode.removeChild(canvas);
			window.removeEventListener('resize', resize);
		};
		if (now) { remove(); return; }
		canvas.style.transition = 'opacity 0.6s ease-out';
		canvas.style.opacity = '0';
		setTimeout(remove, 650);
	}
})();
		</script>
	</body>
</html>
