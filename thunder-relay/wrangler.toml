# Thunder Client relay (Friends): a Cloudflare Worker with one Durable Object per world code, and
# one more (SOCIAL, social.js) for the friends list, who is online and messages.
# Deployed from this folder by Cloudflare (Workers & Pages > Create > Import a repository, root
# directory thunder-relay). The client reaches it directly at its Worker address; the offline file
# (Origin "null") is always allowed, and the sites listed in SITES below are too. See
# thunder/NETWORKING.md.
name = "thunder-relay"
main = "relay.js"
compatibility_date = "2025-09-01"

# Origins allowed to use the relay from a browser, comma-separated (the offline file sends Origin
# "null" and is always let in). Set here so it survives every deploy. The OWNER_KEY secret is set
# in the dashboard (Settings > Variables and Secrets) and is never committed.
[vars]
SITES = "https://thunderclient.pages.dev"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "ThunderRelay"

# SQLite-backed Durable Objects are the kind the Workers Free plan offers
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ThunderRelay"]

[[durable_objects.bindings]]
name = "SOCIAL"
class_name = "ThunderSocial"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ThunderSocial"]
